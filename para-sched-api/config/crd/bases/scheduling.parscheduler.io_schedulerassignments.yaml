---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: schedulerassignments.scheduling.parscheduler.io
spec:
  group: scheduling.parscheduler.io
  names:
    kind: SchedulerAssignment
    listKind: SchedulerAssignmentList
    plural: schedulerassignments
    shortNames:
    - sa
    singular: schedulerassignment
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.schedulerName
      name: Scheduler
      type: string
    - jsonPath: .spec.assignedPartitions
      name: Partitions
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: SchedulerAssignment 定义调度器的分区分配和 ParSync 配置
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SchedulerAssignmentSpec 定义调度器分配的期望状态
            properties:
              assignedPartitions:
                description: AssignedPartitions 分配给该调度器的分区列表
                items:
                  type: integer
                type: array
              configGeneration:
                description: ConfigGeneration 配置版本号（由 Dispatcher 递增）
                format: int64
                minimum: 0
                type: integer
              multiCandidateConfig:
                description: MultiCandidateConfig 多候选配置
                properties:
                  defaultK:
                    default: 3
                    description: DefaultK 默认候选数量
                    maximum: 20
                    minimum: 1
                    type: integer
                  enableDynamicK:
                    default: true
                    description: EnableDynamicK 是否启用动态 K 调整
                    type: boolean
                  enableProbabilityRanking:
                    default: true
                    description: EnableProbabilityRanking 是否启用概率排序
                    type: boolean
                  highPriorityExtraK:
                    default: 2
                    description: HighPriorityExtraK 高优先级 Pod 额外候选数
                    type: integer
                  maxCandidates:
                    default: 10
                    description: MaxCandidates 最大候选数
                    maximum: 50
                    type: integer
                  minCandidates:
                    default: 1
                    description: MinCandidates 最小候选数
                    minimum: 1
                    type: integer
                  scoreThreshold:
                    default: 85
                    description: |-
                      ScoreThreshold 得分阈值 (0-100)，百分比形式
                      只选择得分 >= 最高分 * (ScoreThreshold/100) 的节点
                    maximum: 100
                    minimum: 0
                    type: integer
                  selectionStrategy:
                    default: QualityFirst
                    description: SelectionStrategy 选择策略
                    enum:
                    - QualityFirst
                    - LatencyFirst
                    - WeightedRandom
                    - Adaptive
                    type: string
                type: object
              parSyncConfig:
                description: ParSyncConfig 该调度器使用的 ParSync 配置
                properties:
                  inline:
                    description: Inline 内联配置（优先级高于 Name 引用）
                    properties:
                      criticalEventTypes:
                        description: CriticalEventTypes 需要立即同步的关键事件类型
                        items:
                          type: string
                        type: array
                      enableEventDriven:
                        default: true
                        description: EnableEventDriven 是否启用事件驱动更新
                        type: boolean
                      failoverTimeout:
                        default: 15s
                        description: FailoverTimeout 调度器故障转移超时
                        type: string
                      globalClockSyncEnabled:
                        default: true
                        description: GlobalClockSyncEnabled 是否启用全局时钟同步
                        type: boolean
                      heartbeatInterval:
                        default: 5s
                        description: HeartbeatInterval 心跳间隔
                        type: string
                      numPartitions:
                        default: 4
                        description: NumPartitions 分区数量
                        maximum: 64
                        minimum: 1
                        type: integer
                      rebalancePolicy:
                        allOf:
                        - enum:
                          - MinimalMove
                          - EvenDistribution
                        - enum:
                          - MinimalMove
                          - EvenDistribution
                        default: MinimalMove
                        description: RebalancePolicy 重平衡策略
                        type: string
                      rebalanceThreshold:
                        default: 2
                        description: RebalanceThreshold 触发重平衡的不均匀阈值
                        minimum: 1
                        type: integer
                      stalenessTolerance:
                        default: 5s
                        description: StalenessTolerance 陈旧度容忍阈值
                        type: string
                      syncPeriod:
                        default: 3s
                        description: SyncPeriod 完整同步周期
                        type: string
                    type: object
                  name:
                    description: Name 引用的 ParSyncConfig 名称
                    type: string
                required:
                - name
                type: object
              schedulerId:
                description: SchedulerID 调度器数字 ID（用于同步槽位计算）
                minimum: 0
                type: integer
              schedulerName:
                description: SchedulerName 调度器名称（唯一标识）
                minLength: 1
                type: string
              syncSlots:
                description: SyncSlots 同步时间槽分配
                items:
                  description: SyncSlotSpec 同步时间槽规格
                  properties:
                    offsetMillis:
                      description: OffsetMillis 相对于周期起点的偏移（毫秒）
                      format: int64
                      type: integer
                    partitionId:
                      description: PartitionID 该槽位同步的分区
                      type: integer
                    slotIndex:
                      description: SlotIndex 槽位索引
                      type: integer
                  required:
                  - offsetMillis
                  - partitionId
                  - slotIndex
                  type: object
                type: array
            required:
            - assignedPartitions
            - configGeneration
            - parSyncConfig
            - schedulerId
            - schedulerName
            type: object
          status:
            description: SchedulerAssignmentStatus 定义调度器分配的观察状态
            properties:
              appliedGeneration:
                description: AppliedGeneration 已应用的配置版本
                format: int64
                type: integer
              bindingStats:
                description: BindingStats 绑定统计
                properties:
                  avgAttempts:
                    description: AvgAttempts 平均尝试次数
                    type: string
                  conflictCount:
                    description: ConflictCount 冲突次数
                    format: int64
                    type: integer
                  conflictRate:
                    description: ConflictRate 冲突率
                    type: string
                  failureCount:
                    description: FailureCount 失败次数
                    format: int64
                    type: integer
                  lastUpdateTime:
                    description: LastUpdateTime 最后更新时间
                    format: date-time
                    type: string
                  rankAdoptionCounts:
                    description: RankAdoptionCounts 各排名采纳次数
                    items:
                      format: int64
                      type: integer
                    type: array
                  successCount:
                    description: SuccessCount 成功次数
                    format: int64
                    type: integer
                  totalBindings:
                    description: TotalBindings 总绑定次数
                    format: int64
                    type: integer
                type: object
              conditions:
                description: Conditions 状态条件
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastHeartbeat:
                description: LastHeartbeat 最后心跳时间
                format: date-time
                type: string
              partitionSyncStatus:
                description: PartitionSyncStatus 各分区同步状态
                items:
                  description: PartitionSyncStatusItem 分区同步状态项
                  properties:
                    lastSyncTime:
                      description: LastSyncTime 最后同步时间
                      format: date-time
                      type: string
                    nodeCount:
                      description: NodeCount 分区内节点数
                      type: integer
                    partitionId:
                      description: PartitionID 分区 ID
                      type: integer
                    stalenessSeconds:
                      description: StalenessSeconds 陈旧度（秒）
                      type: string
                    syncFailureCount:
                      description: SyncFailureCount 同步失败次数
                      format: int64
                      type: integer
                    syncGeneration:
                      description: SyncGeneration 同步版本号
                      format: int64
                      type: integer
                    syncSuccessCount:
                      description: SyncSuccessCount 同步成功次数
                      format: int64
                      type: integer
                  required:
                  - partitionId
                  type: object
                type: array
              phase:
                default: Pending
                description: Phase 调度器阶段
                enum:
                - Pending
                - Initializing
                - Running
                - Degraded
                - Failed
                - Terminating
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
