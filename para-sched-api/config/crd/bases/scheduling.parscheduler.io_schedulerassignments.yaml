---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: schedulerassignments.scheduling.parscheduler.io
spec:
  group: scheduling.parscheduler.io
  names:
    kind: SchedulerAssignment
    listKind: SchedulerAssignmentList
    plural: schedulerassignments
    shortNames:
    - sa
    singular: schedulerassignment
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.schedulerName
      name: Scheduler
      type: string
    - jsonPath: .spec.assignedPartitions
      name: Partitions
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: SchedulerAssignment defines the partition assignment and ParSync configuration for a scheduler.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SchedulerAssignmentSpec defines the desired state of a scheduler assignment.
            properties:
              assignedPartitions:
                description: AssignedPartitions lists the partition IDs assigned to this scheduler.
                items:
                  type: integer
                type: array
              configGeneration:
                description: ConfigGeneration is the config version number, incremented by the Dispatcher.
                format: int64
                minimum: 0
                type: integer
              multiCandidateConfig:
                description: MultiCandidateConfig holds the multi-candidate selection configuration.
                properties:
                  defaultK:
                    default: 3
                    description: DefaultK is the default number of candidate nodes to consider.
                    maximum: 20
                    minimum: 1
                    type: integer
                  enableDynamicK:
                    default: true
                    description: EnableDynamicK enables dynamic adjustment of K based on observed conflict rate.
                    type: boolean
                  enableProbabilityRanking:
                    default: true
                    description: EnableProbabilityRanking enables probability-weighted candidate ranking.
                    type: boolean
                  highPriorityExtraK:
                    default: 2
                    description: HighPriorityExtraK is extra candidate slots for high-priority Pods.
                    type: integer
                  maxCandidates:
                    default: 10
                    description: MaxCandidates is the maximum number of candidates.
                    maximum: 50
                    type: integer
                  minCandidates:
                    default: 1
                    description: MinCandidates is the minimum number of candidates.
                    minimum: 1
                    type: integer
                  scoreThreshold:
                    default: 85
                    description: |-
                      ScoreThreshold (0-100) filters nodes whose score >= best_score * (ScoreThreshold/100).
                    maximum: 100
                    minimum: 0
                    type: integer
                  selectionStrategy:
                    default: QualityFirst
                    description: SelectionStrategy controls how the winning candidate is selected.
                    enum:
                    - QualityFirst
                    - LatencyFirst
                    - WeightedRandom
                    - Adaptive
                    type: string
                type: object
              parSyncConfig:
                description: ParSyncConfig references the ParSync configuration used by this scheduler.
                properties:
                  inline:
                    description: Inline is an optional inlined config that takes precedence over Name.
                    properties:
                      criticalEventTypes:
                        description: CriticalEventTypes lists event types that trigger an immediate sync.
                        items:
                          type: string
                        type: array
                      enableEventDriven:
                        default: true
                        description: EnableEventDriven enables immediate partition updates triggered by cluster events.
                        type: boolean
                      failoverTimeout:
                        default: 15s
                        description: FailoverTimeout is the duration after which an unresponsive scheduler triggers partition failover.
                        type: string
                      globalClockSyncEnabled:
                        default: true
                        description: GlobalClockSyncEnabled enables global clock synchronization across schedulers.
                        type: boolean
                      heartbeatInterval:
                        default: 5s
                        description: HeartbeatInterval is the interval between scheduler heartbeats.
                        type: string
                      numPartitions:
                        default: 4
                        description: NumPartitions is the number of partitions to divide the cluster into.
                        maximum: 64
                        minimum: 1
                        type: integer
                      rebalancePolicy:
                        allOf:
                        - enum:
                          - MinimalMove
                          - EvenDistribution
                        - enum:
                          - MinimalMove
                          - EvenDistribution
                        default: MinimalMove
                        description: RebalancePolicy controls how partition assignments are rebalanced.
                        type: string
                      rebalanceThreshold:
                        default: 2
                        description: RebalanceThreshold is the imbalance ratio above which rebalancing is triggered.
                        minimum: 1
                        type: integer
                      stalenessTolerance:
                        default: 5s
                        description: StalenessTolerance is the maximum acceptable partition view age before a scheduler is considered stale.
                        type: string
                      syncPeriod:
                        default: 3s
                        description: SyncPeriod is the full partition sync cycle duration.
                        type: string
                    type: object
                  name:
                    description: Name is the referenced ParSyncConfig resource name.
                    type: string
                required:
                - name
                type: object
              schedulerId:
                description: SchedulerID is the numeric scheduler ID used for sync slot calculation.
                minimum: 0
                type: integer
              schedulerName:
                description: SchedulerName is the unique name of the scheduler.
                minLength: 1
                type: string
              syncSlots:
                description: SyncSlots holds the sync time slot assignments for this scheduler.
                items:
                  description: SyncSlotSpec describes a single sync time slot.
                  properties:
                    offsetMillis:
                      description: OffsetMillis is the offset in milliseconds from the start of the sync period.
                      format: int64
                      type: integer
                    partitionId:
                      description: PartitionID is the partition synced in this slot.
                      type: integer
                    slotIndex:
                      description: SlotIndex is the index of this sync slot.
                      type: integer
                  required:
                  - offsetMillis
                  - partitionId
                  - slotIndex
                  type: object
                type: array
            required:
            - assignedPartitions
            - configGeneration
            - parSyncConfig
            - schedulerId
            - schedulerName
            type: object
          status:
            description: SchedulerAssignmentStatus defines the observed state of a scheduler assignment.
            properties:
              appliedGeneration:
                description: AppliedGeneration is the config generation last applied by this scheduler.
                format: int64
                type: integer
              bindingStats:
                description: BindingStats reports binding outcome statistics for this scheduler.
                properties:
                  avgAttempts:
                    description: AvgAttempts is the mean number of bind attempts per pod.
                    type: string
                  conflictCount:
                    description: ConflictCount is the number of conflict-induced bind failures.
                    format: int64
                    type: integer
                  conflictRate:
                    description: ConflictRate is the ratio of conflict failures to total bindings.
                    type: string
                  failureCount:
                    description: FailureCount is the number of failed binds.
                    format: int64
                    type: integer
                  lastUpdateTime:
                    description: LastUpdateTime is when these stats were last updated.
                    format: date-time
                    type: string
                  rankAdoptionCounts:
                    description: RankAdoptionCounts is the per-rank adoption histogram (index = rank chosen).
                    items:
                      format: int64
                      type: integer
                    type: array
                  successCount:
                    description: SuccessCount is the number of successful binds.
                    format: int64
                    type: integer
                  totalBindings:
                    description: TotalBindings is the total number of bind attempts.
                    format: int64
                    type: integer
                type: object
              conditions:
                description: Conditions holds standard Kubernetes condition values.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastHeartbeat:
                description: LastHeartbeat is the timestamp of the most recent heartbeat.
                format: date-time
                type: string
              partitionSyncStatus:
                description: PartitionSyncStatus holds per-partition sync status.
                items:
                  description: PartitionSyncStatusItem holds the sync status for a single partition.
                  properties:
                    lastSyncTime:
                      description: LastSyncTime is when the partition was last synced.
                      format: date-time
                      type: string
                    nodeCount:
                      description: NodeCount is the number of nodes in this partition.
                      type: integer
                    partitionId:
                      description: PartitionID identifies the partition.
                      type: integer
                    stalenessSeconds:
                      description: StalenessSeconds is the partition view age in seconds at the last check.
                      type: string
                    syncFailureCount:
                      description: SyncFailureCount is the cumulative failed sync count.
                      format: int64
                      type: integer
                    syncGeneration:
                      description: SyncGeneration is the sync generation counter for this partition.
                      format: int64
                      type: integer
                    syncSuccessCount:
                      description: SyncSuccessCount is the cumulative successful sync count.
                      format: int64
                      type: integer
                  required:
                  - partitionId
                  type: object
                type: array
              phase:
                default: Pending
                description: Phase is the current lifecycle phase of the scheduler.
                enum:
                - Pending
                - Initializing
                - Running
                - Degraded
                - Failed
                - Terminating
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
