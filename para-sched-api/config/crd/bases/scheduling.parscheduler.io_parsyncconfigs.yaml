    name: v1
    schema:
      openAPIV3Schema:
        description: ParSyncConfig defines the global ParSync configuration.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ParSyncConfigSpec defines the desired state of a ParSyncConfig.
            properties:
              criticalEventTypes:
                description: CriticalEventTypes lists event types that trigger an immediate sync.
                items:
                  type: string
                type: array
              enableEventDriven:
                default: true
                description: EnableEventDriven enables immediate partition updates triggered by cluster events.
                type: boolean
              failoverTimeout:
                default: 15s
                description: FailoverTimeout is the duration after which an unresponsive scheduler triggers partition failover.
                type: string
              globalClockSyncEnabled:
                default: true
                description: GlobalClockSyncEnabled enables global clock synchronization across schedulers.
                type: boolean
              heartbeatInterval:
                default: 5s
                description: HeartbeatInterval is the interval between scheduler heartbeats.
                type: string
              numPartitions:
                default: 4
                description: NumPartitions is the number of partitions to divide the cluster into.
                maximum: 64
                minimum: 1
                type: integer
              rebalancePolicy:
                allOf:
                - enum:
                  - MinimalMove
                  - EvenDistribution
                - enum:
                  - MinimalMove
                  - EvenDistribution
                default: MinimalMove
                description: RebalancePolicy controls how partition assignments are rebalanced.
                type: string
              rebalanceThreshold:
                default: 2
                description: RebalanceThreshold is the imbalance ratio above which rebalancing is triggered.
                minimum: 1
                type: integer
              stalenessTolerance:
                default: 5s
                description: StalenessTolerance is the maximum acceptable partition view age before a scheduler is considered stale.
                type: string
              syncPeriod:
                default: 3s
                description: SyncPeriod is the full partition sync cycle duration.
                type: string
            type: object
