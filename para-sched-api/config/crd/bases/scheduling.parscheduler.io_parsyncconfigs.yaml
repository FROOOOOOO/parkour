                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentEpoch:
                description: CurrentEpoch is the current sync epoch counter.
                format: int64
                type: integer
              globalClockBase:
                description: GlobalClockBase is the global sync clock origin in Unix nanoseconds.
                format: int64
                type: integer
              lastRebalanceTime:
                description: LastRebalanceTime is when the last partition rebalance occurred.
                format: date-time
                type: string
              partitionAssignments:
                additionalProperties:
                  type: string
                description: PartitionAssignments maps partition IDs to the scheduler name that owns them.
                type: object
              schedulerStatuses:
                description: SchedulerStatuses is a summary of every registered scheduler's status.
                items:
                  description: SchedulerStatusSummary is a brief status snapshot for a single scheduler.
                  properties:
                    assignedPartitions:
                      description: AssignedPartitions is the number of partitions assigned to this scheduler.
                      type: integer
                    healthy:
                      description: Healthy reports whether the scheduler is considered healthy.
                      type: boolean
                    lastHeartbeat:
                      description: LastHeartbeat is the timestamp of the most recent heartbeat from this scheduler.
                      format: date-time
                      type: string
                    name:
                      description: Name is the scheduler's name.
                      type: string
                    phase:
                      description: Phase is the scheduler's current lifecycle phase.
                      enum:
                      - Pending
                      - Initializing
                      - Running
                      - Degraded
                      - Failed
                      - Terminating
                      type: string
                    schedulerId:
                      description: SchedulerID is the scheduler's numeric ID.
