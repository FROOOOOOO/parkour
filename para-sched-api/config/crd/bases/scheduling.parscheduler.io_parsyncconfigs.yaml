              criticalEventTypes:
                description: CriticalEventTypes 需要立即同步的关键事件类型
                items:
                  type: string
                type: array
              enableEventDriven:
                default: true
                description: EnableEventDriven 是否启用事件驱动更新
                type: boolean
              failoverTimeout:
