                format: int64
                type: integer
              lastRebalanceTime:
                description: LastRebalanceTime 最后重平衡时间
                format: date-time
                type: string
              partitionAssignments:
                additionalProperties:
                  type: string
                description: PartitionAssignments 分区分配映射 (partitionID -> schedulerName)
                type: object
              schedulerStatuses:
                description: SchedulerStatuses 各调度器状态摘要
                items:
                  description: SchedulerStatusSummary 调度器状态摘要
                  properties:
                    assignedPartitions:
                      description: AssignedPartitions 分配的分区数
                      type: integer
                    healthy:
                      description: Healthy 是否健康
