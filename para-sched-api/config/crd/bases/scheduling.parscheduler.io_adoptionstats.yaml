---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: adoptionstats.scheduling.parscheduler.io
spec:
  group: scheduling.parscheduler.io
  names:
    kind: AdoptionStats
    listKind: AdoptionStatsList
    plural: adoptionstats
    shortNames:
    - as
    singular: adoptionstats
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.totalBindings
      name: Total
      type: integer
    - jsonPath: .status.successCount
      name: Success
      type: integer
    - jsonPath: .status.conflictRate
      name: ConflictRate
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: AdoptionStats defines cross-scheduler adoption statistics.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AdoptionStatsSpec defines the desired state of an AdoptionStats resource.
            properties:
              aggregationInterval:
                default: 10s
                description: AggregationInterval is how often adoption counts are aggregated.
                type: string
              decayFactor:
                default: "0.95"
                description: DecayFactor is the per-interval exponential decay multiplier applied to counters.
                type: string
              maxCandidates:
                default: 10
                description: MaxCandidates is the maximum candidate count (determines the stats array size).
                maximum: 50
                minimum: 1
                type: integer
              parSyncConfigRef:
                description: ParSyncConfigRef names the ParSyncConfig this resource is associated with.
                type: string
              retentionPeriod:
                default: 1h
                description: RetentionPeriod is how long historical adoption data is retained.
                type: string
            required:
            - parSyncConfigRef
            type: object
          status:
            description: AdoptionStatsStatus defines the observed adoption statistics.
            properties:
              avgAttempts:
                description: AvgAttempts is the mean number of bind attempts per pod.
                type: string
              conflictRate:
                description: ConflictRate is the aggregate conflict rate as a decimal string (e.g. "0.15").
                type: string
              contributingSchedulers:
                description: ContributingSchedulers lists the scheduler names that have contributed data to this resource.
                items:
                  type: string
                type: array
              failureCount:
                description: FailureCount is the number of failed binds.
                format: int64
                type: integer
              globalCounts:
                description: |-
                  GlobalCounts is the global adoption histogram; index i = times the i-th candidate was chosen;
                  the last element counts total failures.
                items:
                  format: int64
                  type: integer
                type: array
              lastDecayTime:
                description: LastDecayTime is when decay was last applied to the counters.
                format: date-time
                type: string
              lastUpdateTime:
                description: LastUpdateTime is when these stats were last updated.
                format: date-time
                type: string
              nodeCounts:
                additionalProperties:
                  items:
                    format: int64
                    type: integer
                  type: array
                description: |-
                  NodeCounts maps node names to [attempts, conflicts] pairs for the Scheduler's Penalty mechanism:
                    [0] = attempts  = total bind attempts on this node (success + failure)
                    [1] = conflicts = bind failures on this node (incremented on any conflict)

                  Sparse: only nodes with conflicts > 0 are stored; absent nodes default to 0 conflict rate.
                  Both counters are exponentially decayed by DecayFactor on each interval (default 0.95/1min),
                  prioritising recent observations. Schedulers derive per-node conflict rate as conflicts/attempts.
                type: object
              partitionCounts:
                additionalProperties:
                  items:
                    format: int64
                    type: integer
                  type: array
                description: |-
                  PartitionCounts maps string partition IDs to per-partition adoption count vectors.
                type: object
              recentSuccessRate:
                description: RecentSuccessRate is the recent bind success rate from a sliding window.
                type: string
              successCount:
                description: SuccessCount is the number of successful binds.
                format: int64
                type: integer
              totalBindings:
                description: TotalBindings is the total number of bind attempts.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
