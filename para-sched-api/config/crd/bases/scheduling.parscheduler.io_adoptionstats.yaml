---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: adoptionstats.scheduling.parscheduler.io
spec:
  group: scheduling.parscheduler.io
  names:
    kind: AdoptionStats
    listKind: AdoptionStatsList
    plural: adoptionstats
    shortNames:
    - as
    singular: adoptionstats
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.totalBindings
      name: Total
      type: integer
    - jsonPath: .status.successCount
      name: Success
      type: integer
    - jsonPath: .status.conflictRate
      name: ConflictRate
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: AdoptionStats 定义采纳统计
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AdoptionStatsSpec 定义采纳统计的期望状态
            properties:
              aggregationInterval:
                default: 10s
                description: AggregationInterval 聚合间隔
                type: string
              decayFactor:
                default: "0.95"
                description: DecayFactor 衰减因子
                type: string
              maxCandidates:
                default: 10
                description: MaxCandidates 最大候选数（决定统计数组大小）
                maximum: 50
                minimum: 1
                type: integer
              parSyncConfigRef:
                description: ParSyncConfigRef 关联的 ParSync 配置
                type: string
              retentionPeriod:
                default: 1h
                description: RetentionPeriod 数据保留周期
                type: string
            required:
            - parSyncConfigRef
            type: object
          status:
            description: AdoptionStatsStatus 定义采纳统计的观察状态
            properties:
              avgAttempts:
                description: AvgAttempts 平均尝试次数
                type: string
              conflictRate:
                description: ConflictRate 冲突率（字符串形式，如 "0.15"）
                type: string
              contributingSchedulers:
                description: ContributingSchedulers 贡献数据的调度器列表
                items:
                  type: string
                type: array
              failureCount:
                description: FailureCount 失败次数
                format: int64
                type: integer
              globalCounts:
                description: |-
                  GlobalCounts 全局采纳计数向量
                  索引 i 表示第 i 个候选被采纳的次数，最后一个是全部失败的次数
                items:
                  format: int64
                  type: integer
                type: array
              lastDecayTime:
                description: LastDecayTime 最后衰减时间
                format: date-time
                type: string
              lastUpdateTime:
                description: LastUpdateTime 最后更新时间
                format: date-time
                type: string
              nodeCounts:
                additionalProperties:
                  items:
                    format: int64
                    type: integer
                  type: array
                description: |-
                  NodeCounts 节点级 [attempts, conflicts] 计数，用于 Scheduler 的 Penalty 机制
                  按节点差异化打分。每个 value 是长度为 2 的 int64 切片：
                    [0] = attempts  = 该节点上发起过的 bind 总次数 (success + failure)
                    [1] = conflicts = 该节点上失败的 bind 次数（任一次 bind conflict 即 ++）

                  稀疏写入：只包含 conflicts > 0 的节点；scheduler 端对未出现的节点默认 0 冲突率。
                  两个计数都通过 AdoptionStatsCache.Decay 按 DecayFactor 等比衰减（默认 0.95/1min），
                  体现"近期为重"的统计语义。Scheduler 端直接用 conflicts/attempts 作为 per-node 冲突率。
                type: object
              partitionCounts:
                additionalProperties:
                  items:
                    format: int64
                    type: integer
                  type: array
                description: |-
                  PartitionCounts 分区级采纳计数
                  key 是分区 ID 的字符串形式
                type: object
              recentSuccessRate:
                description: RecentSuccessRate 近期成功率（滑动窗口）
                type: string
              successCount:
                description: SuccessCount 成功次数
                format: int64
                type: integer
              totalBindings:
                description: TotalBindings 总绑定次数
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
