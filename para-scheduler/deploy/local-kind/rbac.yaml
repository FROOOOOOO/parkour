apiVersion: v1
kind: ServiceAccount
metadata:
  name: para-scheduler
  namespace: para-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: para-scheduler
rules:
  # Core: pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods/binding"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["patch", "update"]
  # Core: nodes
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # ConfigMaps for partition snapshots.
  # `delete` is required by SnapshotPublisher.cleanupStaleChunks (P2)
  # when a partition shrinks below a chunk boundary.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Para-sched CRDs
  - apiGroups: ["scheduling.parscheduler.io"]
    resources: ["parsyncconfigs", "schedulerassignments", "adoptionstats"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["scheduling.parscheduler.io"]
    resources: ["parsyncconfigs/status", "schedulerassignments/status", "adoptionstats/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: para-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: para-scheduler
subjects:
  - kind: ServiceAccount
    name: para-scheduler
    namespace: para-system
