# Extra RBAC bindings for kube-scheduler running as a Deployment pod.
# kube-scheduler's built-in informers require read access to storage,
# policy, services, PVs, etc. that the custom ClusterRole does not cover.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: para-scheduler-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-scheduler
subjects:
  - kind: ServiceAccount
    name: para-scheduler
    namespace: para-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: para-scheduler-volume
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:volume-scheduler
subjects:
  - kind: ServiceAccount
    name: para-scheduler
    namespace: para-system
