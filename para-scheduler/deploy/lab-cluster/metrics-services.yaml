# NodePort Services for exposing Prometheus metrics endpoints.
# Binder: 30080, Dispatcher: 30081
# Scheduler instances use scheduler-metrics-svc-template.yaml (30090+index).
---
apiVersion: v1
kind: Service
metadata:
  name: binder-metrics
  namespace: para-system
  labels:
    app: para-binder
    component: para-sched
spec:
  type: NodePort
  selector:
    app: para-binder
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcher-metrics
  namespace: para-system
  labels:
    app: para-dispatcher
    component: para-sched
spec:
  type: NodePort
  selector:
    app: para-dispatcher
  ports:
    - name: metrics
      port: 8081
      targetPort: 8081
      nodePort: 30081
---
# In-cluster Service for the dispatcher's /ready endpoint. Lets
# Scheduler/Binder initContainers (or `kubectl wait` from the experiment
# script) reach the readiness probe by stable DNS name. ClusterIP only —
# this endpoint is not meant to be scraped from outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: para-dispatcher
  namespace: para-system
  labels:
    app: para-dispatcher
    component: para-sched
spec:
  type: ClusterIP
  selector:
    app: para-dispatcher
  ports:
    - name: ready
      port: 8082
      targetPort: 8082
