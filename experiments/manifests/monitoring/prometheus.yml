  # ============================================================
  #  Godel baseline (E1 / E2) — NodePort on master <MASTER_IP>
  #  All endpoints are plain HTTP on Godel's insecure metrics port.
  #  The `baseline: godel` label lets PromQL filter E1/E2 series cleanly
  #  vs para-sched series (which carry no such label, equivalent to "parasched").
  # ============================================================

  # Binder — :10451 → NodePort 30200
  - job_name: "godel-binder"
    metrics_path: /metrics
    static_configs:
      - targets: ["<MASTER_IP>:30200"]
        labels:
          component: "binder"
          baseline: "godel"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "godel-binder"

