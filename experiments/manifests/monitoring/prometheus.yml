# Prometheus configuration for para-sched experiments.
# Covers up to 16 scheduler instances (NodePort 30090-30105).
# Unused scheduler targets will show as "down" — no impact on active ones.
#
# Generated for lab cluster:
#   A (<MONITORING_IP>) — Prometheus, Grafana, KWOK
#   B (<MASTER_IP>) — Master, API Server, etcd, para-sched components
#   C/D/E (<WORKER_IP>/29/30) — Workers

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    job: "k8s-monitoring"

storage:
  tsdb:
    out_of_order_time_window: 5m

rule_files:
  - "/etc/prometheus/rules/prom-rules.yml"

scrape_configs:
  # ============================================================
  #  K8s core components
  # ============================================================

  # 1. kube-apiserver
  - job_name: "kube-apiserver"
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["<MASTER_IP>:6443"]
    tls_config:
      ca_file: /etc/prometheus/tls/ca.crt
    authorization:
      credentials_file: /etc/prometheus/tls/token
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "kube-apiserver"

  # 2. kube-controller-manager
  - job_name: "kube-controller-manager"
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["<MASTER_IP>:10257"]
    tls_config:
      insecure_skip_verify: true
    authorization:
      credentials_file: /etc/prometheus/tls/token
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "kube-controller-manager"

  # 3. kube-scheduler (default, disabled when para-sched replaces it)
  - job_name: "kube-scheduler"
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["<MASTER_IP>:10259"]
    tls_config:
      insecure_skip_verify: true
    authorization:
      credentials_file: /etc/prometheus/tls/token
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "kube-scheduler"

  # 4. etcd
  - job_name: "etcd"
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["<MASTER_IP>:2379"]
    tls_config:
      ca_file: /etc/prometheus/tls/etcd/ca.crt
      cert_file: /etc/prometheus/tls/etcd/client.crt
      key_file: /etc/prometheus/tls/etcd/client.key
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "etcd"

  # 5. Node Exporter
  - job_name: "nodes"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "<MASTER_IP>:9100"
          - "<WORKER_IP>:9100"
          - "<WORKER_IP>:9100"
          - "<WORKER_IP>:9100"

  # 6. kubelet
  - job_name: "kubelet"
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - "<MASTER_IP>:10250"
          - "<WORKER_IP>:10250"
          - "<WORKER_IP>:10250"
          - "<WORKER_IP>:10250"
    tls_config:
      ca_file: /etc/prometheus/tls/ca.crt
      insecure_skip_verify: true
      cert_file: /etc/prometheus/tls/kubelet/client.crt
      key_file: /etc/prometheus/tls/kubelet/client.key
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "kubelet"

  # 7. kubelet-cadvisor
  - job_name: "kubelet-cadvisor"
    scheme: https
    metrics_path: /metrics/cadvisor
    static_configs:
      - targets:
          - "<MASTER_IP>:10250"
          - "<WORKER_IP>:10250"
          - "<WORKER_IP>:10250"
          - "<WORKER_IP>:10250"
    tls_config:
      ca_file: /etc/prometheus/tls/ca.crt
      insecure_skip_verify: true
      cert_file: /etc/prometheus/tls/kubelet/client.crt
      key_file: /etc/prometheus/tls/kubelet/client.key
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "kubelet-cadvisor"

  # 8. kube-state-metrics
  - job_name: "kube-state-metrics"
    metrics_path: /metrics
    static_configs:
      - targets: ["<MASTER_IP>:32296"]

  # 9. Prometheus self
  - job_name: "prometheus"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: prometheus

  # ============================================================
  #  Para-Sched components (NodePort on master <MASTER_IP>)
  # ============================================================

  # Binder — HTTP metrics on NodePort 30080
  - job_name: "parasched-binder"
    metrics_path: /metrics
    static_configs:
      - targets: ["<MASTER_IP>:30080"]
        labels:
          component: "binder"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "parasched-binder"

  # Dispatcher — HTTP metrics on NodePort 30081
  - job_name: "parasched-dispatcher"
