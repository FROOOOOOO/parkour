{{$ENABLE_CHAOSMONKEY := DefaultParam .ENABLE_CHAOSMONKEY false}}

# 10 KWOK shards (kwok.service=fake0, kwok1.service=fake1, ..., kwok9.service=fake9)
# Each shard manages 1/10 of the nodes, identified by annotation kwok.x-k8s.io/node=fakeN.
#
# Per-shard CPU/Memory can be overridden independently — for the heterogeneous-capacity (HC-V) experiment.
# Default (V=0): all shards use 32 CPU / 256 Gi, matching the HC-1 baseline.
# Non-zero V values are generated by generate-hetero-config.py as testoverride parameters.
#
# Constraints (enforced by the upstream generator; not validated by this template):
#   - Per-shard CPU ∈ [24, 47]  →  floor(CPU / 24)=1, each node fits exactly one 24-CPU pod
#   - Σ shard_CPU = 320          →  total cluster pod capacity = N (1:1 with HC-1)
#   - Memory scales with CPU (8 Gi per CPU)
{{$NUM_SHARDS := 10}}
{{$NODES_PER_SHARD := DivideInt .Nodes $NUM_SHARDS}}

# Capacity variance label — attached to nodes so run-experiment.sh can detect and reuse it.
# Value is a plain string ("0" / "0.3" / "0.6" / "1.0"), consistent with generate-hetero-config.py.
{{$VARIANCE := DefaultParam .CAPACITY_VARIANCE "0"}}

# Per-shard CPU / Memory defaults — 32 CPU / 256 Gi when not overridden (equivalent to HC-1).
{{$CPU_S0 := DefaultParam .CPU_S0 "32"}}
{{$CPU_S1 := DefaultParam .CPU_S1 "32"}}
{{$CPU_S2 := DefaultParam .CPU_S2 "32"}}
{{$CPU_S3 := DefaultParam .CPU_S3 "32"}}
{{$CPU_S4 := DefaultParam .CPU_S4 "32"}}
{{$CPU_S5 := DefaultParam .CPU_S5 "32"}}
{{$CPU_S6 := DefaultParam .CPU_S6 "32"}}
{{$CPU_S7 := DefaultParam .CPU_S7 "32"}}
{{$CPU_S8 := DefaultParam .CPU_S8 "32"}}
{{$CPU_S9 := DefaultParam .CPU_S9 "32"}}
{{$MEM_S0 := DefaultParam .MEM_S0 "256Gi"}}
{{$MEM_S1 := DefaultParam .MEM_S1 "256Gi"}}
{{$MEM_S2 := DefaultParam .MEM_S2 "256Gi"}}
{{$MEM_S3 := DefaultParam .MEM_S3 "256Gi"}}
{{$MEM_S4 := DefaultParam .MEM_S4 "256Gi"}}
{{$MEM_S5 := DefaultParam .MEM_S5 "256Gi"}}
{{$MEM_S6 := DefaultParam .MEM_S6 "256Gi"}}
{{$MEM_S7 := DefaultParam .MEM_S7 "256Gi"}}
{{$MEM_S8 := DefaultParam .MEM_S8 "256Gi"}}
{{$MEM_S9 := DefaultParam .MEM_S9 "256Gi"}}

name: kwok-node

tuningSets:
- name: Uniformtinyqps
  qpsLoad:
    qps: 0.1
- name: Uniform1qps
  qpsLoad:
    qps: 1
- name: Uniform100qps
  qpsLoad:
    qps: 100
{{if $ENABLE_CHAOSMONKEY}}
chaosMonkey:
  nodeFailure:
    failureRate: 0.01
    interval: 1m
    jitterFactor: 10.0
    simulatedDowntime: 10m
{{end}}
steps:
- name: Create kwok shard-0 nodes
  phases:
  - namespaceRange:
      min: 1
      max: 1
    replicasPerNamespace: {{$NODES_PER_SHARD}}
    tuningSet: Uniform100qps
    objectBundle:
    - basename: kwok-s0-node
      objectTemplatePath: "kwok-node.yaml"
      templateFillMap:
        Annotation: fake0
        ShardID: "0"
        Variance: "{{$VARIANCE}}"
        CPU: "{{$CPU_S0}}"
        Memory: "{{$MEM_S0}}"
- name: Create kwok shard-1 nodes
