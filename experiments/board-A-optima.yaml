# Parameter-sensitivity sweep conclusions (filled in by hand).
#
# Procedure:
#   1. Run the K sweep in run-sensitivity.sh, inspect the results, pick K*.
#   2. Run the strategy sweep (pass --k-star K*), pick strategy*.
#   3. Run the p sweep (pass --k-star K* --strategy-star strategy*), pick p*.
#   4. Write each paradigm's K* / strategy* / p* into this file.
#   5. batch-run.sh then reads these values as the parameters for the
#      E3 / P4 / Ab-*-{M,P,MP} configurations.
#
# "__TBD__" means not yet determined. Downstream experiments refuse to run
# until real values are filled in (override with --skip-optima-check for a
# dry-run preview only).
#
# Note on K: this is the number of *backup* candidates, passed straight through
# to --parasched-candidate-k. The total candidate list length is K + 1. The
# paper counts the whole list, so its K=3 is K: 2 here.
#
# The ParKour paper deploys K: 2, strategy: QualityFirst, penalty_weight: 0.5
# in both paradigms. Those values are the outcome of the sweep below on this
# testbed; re-derive them for your own cluster rather than assuming them.

event_driven:
  K: __TBD__             # one of {0, 1, 2, 4}
  strategy: __TBD__               # QualityFirst | WeightedRandom
                                  # (ParSync-family strategies need a per-partition
                                  #  freshness signal and degenerate under event-driven
                                  #  synchronization, so they are not selectable here)
  penalty_weight: __TBD__ # one of {0.0, 0.1, 0.3, 0.5, 0.7}

periodic:
  K: __TBD__             # one of {0, 1, 2, 4}
  strategy: __TBD__               # QualityFirst | LatencyFirst | WeightedRandom |
                                  # QualityFirstParSync | LatencyFirstParSync
                                  # The last two are ParSync's (ATC'21) partition-grain
                                  # selection. They are only meaningful when
                                  # sync_pattern is one of {same, diff}; under glob every
                                  # partition has identical freshness and they degenerate.
  penalty_weight: __TBD__ # one of {0.0, 0.1, 0.3, 0.5, 0.7}
                          # Ignored by LatencyFirst; every other strategy scores with
                          # (1-p)*normScore + p*(1-conflictRate).
