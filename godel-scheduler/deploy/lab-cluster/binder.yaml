# Godel Binder deployment for lab cluster (1master+3worker, K8s v1.33.5).
# Acts as the E1/E2 baseline binder — vanilla Godel, no para-sched extensions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: binder
  namespace: godel-system
  labels:
    app: binder
    component: godel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: binder
  template:
    metadata:
      labels:
        app: binder
        component: godel
    spec:
      serviceAccountName: godel
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      containers:
        - name: binder
          image: godel-local:latest
          imagePullPolicy: Never
          command: ["/usr/local/bin/binder"]
          args:
            - "--leader-elect=false"
            - "--tracer=noop"
            - "--v=4"
            - "--feature-gates=ResourceReservation=true"
            - "--reservation-ttl=60"
          env:
            - name: TZ
              value: UTC
          ports:
            - name: metrics
              containerPort: 10451
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            # Memory intentionally unbounded — OOM-kill of binder mid-experiment
            # invalidates the trial. Match para-scheduler binder budget.
          volumeMounts:
            - name: binder-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: binder-config
          configMap:
            name: godel-binder-config
            items:
              - key: godel-binder-config
                path: binder.config
